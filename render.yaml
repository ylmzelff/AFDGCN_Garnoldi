services:
  - type: web
    name: afdgcn-backend
    runtime: node
    rootDir: backend-ts
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 9001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUSTM_API_URL
        value: https://ausapi.kayseri.bel.tr:18880
      - key: AUSTM_API_TOKEN
        sync: false
      - key: PYTHON_MODEL_URL
        sync: false
      - key: WS_BROADCAST_INTERVAL_MS
        value: 600000
      - key: BG_FETCH_INTERVAL_MS
        value: 600000
