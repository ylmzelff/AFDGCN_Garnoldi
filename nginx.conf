events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting — API endpoint'leri için
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Phase API upstream (port 9001)
    upstream phase_api {
        server phase_api:9001;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ─── React Frontend (static) ──────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — tüm bilinmeyen path'ler index.html'e gider
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Phase API (REST) ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/api/(.*) /$1 break;
            proxy_pass         http://phase_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ─── WebSocket (live faz push) ────────────────────────────────────
        location /ws/ {
            proxy_pass         http://phase_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;    # WebSocket bağlantısı uzun sürer
        }

        # ─── Sağlık kontrolü (load balancer için) ────────────────────────
        location /health {
            proxy_pass http://phase_api/health;
            access_log off;
        }
    }
}
