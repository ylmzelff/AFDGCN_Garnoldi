version: "3.9"

# =============================================================================
# AFDGCN Trafik Işığı Faz Sistemi
# =============================================================================
#
#  ┌──────────────────┐     ┌────────────────────┐     ┌──────────────┐
#  │  React Frontend  │────▶│  phase_api :9001   │────▶│ kayseri_api  │
#  │  (nginx :80)     │◀WS──│  (AFDGCN+Webster)  │     │ :9000 (ext.) │
#  └──────────────────┘     └────────────────────┘     └──────────────┘
#                                    │
#                             ┌──────▼──────┐
#                             │  PostgreSQL  │
#                             │  :5432       │
#                             └─────────────┘
#
# Başlatma:
#   docker-compose up -d
#
# İlk kurulum (tablolar):
#   docker-compose exec phase_api python scripts/init_db.py
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — faz tahmin logları ve model olayları
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: afdgcn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: afdgcn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afdgcn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Phase API — port 9001
  # AFDGCN tahmin + Webster faz hesabı + WebSocket push
  # ─────────────────────────────────────────────────────────────────────────
  phase_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afdgcn_phase_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 9001 --workers 1
    environment:
      # Veritabanı
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@postgres:5432/afdgcn

      # Belediye kayseri_api adresi — gerçek URL gelince burası güncellenir
      # Runtime güncellemesi için: POST /admin/update-kayseri-url?url=http://...
      KAYSERI_API_URL: ${KAYSERI_API_URL:-http://host.docker.internal:9000}
      KAYSERI_USERNAME: ${KAYSERI_USERNAME:-demo}
      KAYSERI_PASSWORD: ${KAYSERI_PASSWORD:-demo123}

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-kayseri-traffic-api-secret-key-2026-change-in-production}

      # WebSocket broadcast aralığı (saniye)
      WS_BROADCAST_INTERVAL: ${WS_BROADCAST_INTERVAL:-600}

      # Log seviyesi
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./saved_models:/app/saved_models:ro
      - ./data:/app/data:ro
      - ./model:/app/model:ro
    networks:
      - afdgcn_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx — reverse proxy + React frontend static dosyaları
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: afdgcn_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro # React build çıktısı
    depends_on:
      - phase_api
    networks:
      - afdgcn_network
    restart: unless-stopped

# =============================================================================
volumes:
  postgres_data:

networks:
  afdgcn_network:
    driver: bridge
