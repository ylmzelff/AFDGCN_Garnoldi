version: "3.9"

# =============================================================================
# AFDGCN Trafik Işığı Faz Sistemi
# =============================================================================
#
#  ┌──────────────────┐     ┌────────────────────┐     ┌──────────────┐
#  │  React Frontend  │────▶│  phase_api :9001   │────▶│ kayseri_api  │
#  │  (nginx :80)     │◀WS──│  (AFDGCN+Webster)  │     │ :9000 (ext.) │
#  └──────────────────┘     └────────────────────┘     └──────────────┘
#                                    │
#                             ┌──────▼──────┐
#                             │  PostgreSQL  │
#                             │  :5432       │
#                             └─────────────┘
#
# Başlatma:
#   docker-compose up -d
#
# İlk kurulum (tablolar):
#   docker-compose exec phase_api python scripts/init_db.py
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # PostgreSQL — faz tahmin logları ve model olayları
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: afdgcn_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: afdgcn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afdgcn_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Phase API — port 9001
  # AFDGCN tahmin + Webster faz hesabı + WebSocket push
  # ─────────────────────────────────────────────────────────────────────────
  phase_api:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile
    container_name: afdgcn_phase_api
    environment:
      NODE_ENV: production
      PORT: 9001
      # Veritabanı
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/afdgcn

      # Kayseri Belediye API
      KAYSERI_API_URL: ${KAYSERI_API_URL:-http://host.docker.internal:9000}
      KAYSERI_USERNAME: ${KAYSERI_USERNAME:-demo}
      KAYSERI_PASSWORD: ${KAYSERI_PASSWORD:-demo123}

      # AusTKM Gerçek API
      AUSTM_API_URL: ${AUSTM_API_URL:-https://ausapi.kayseri.bel.tr:18880}
      AUSTM_API_TOKEN: ${AUSTM_API_TOKEN:-}

      # Python Model Sunucusu
      PYTHON_MODEL_URL: http://model_server:9002

      # JWT
      JWT_SECRET: ${JWT_SECRET:-kayseri-traffic-api-secret-key-2026-change-in-production}

      # Aralıklar (ms)
      WS_BROADCAST_INTERVAL_MS: ${WS_BROADCAST_INTERVAL_MS:-600000}
      BG_FETCH_INTERVAL_MS: ${BG_FETCH_INTERVAL_MS:-600000}

      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "9001:9001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - afdgcn_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # Python Model Sunucusu — port 9002
  # AFDGCN tahmin motoru (PyTorch + torch_geometric)
  # ─────────────────────────────────────────────────────────────────────────
  model_server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: afdgcn_model_server
    ports:
      - "9002:9002"
    volumes:
      - ./saved_models:/app/saved_models
    networks:
      - afdgcn_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9002/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # Nginx — reverse proxy + React frontend static dosyaları
  # ─────────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: afdgcn_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro # React build çıktısı
    depends_on:
      - phase_api
    networks:
      - afdgcn_network
    restart: unless-stopped

# =============================================================================
volumes:
  postgres_data:

networks:
  afdgcn_network:
    driver: bridge
